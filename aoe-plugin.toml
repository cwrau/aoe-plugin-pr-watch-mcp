# io.cwrau.pr-watch: persistent PR/MR watch service. See
# docs/superpowers/specs/2026-09-20-pr-watch-mcp-design.md for the design
# this manifest implements, and docs/superpowers/plans/2026-09-20-pr-watch-mcp.md
# for how the worker binary itself is built.

id = "io.cwrau.pr-watch"
name = "PR Watch"
version = "0.1.0"
api_version = 13
aoe_version = ">=1.11.0, <2.0.0"
description = "Persistent GitHub PR / GitLab MR watcher: register once, get woken on review/CI/merge activity, even across session restarts."

# net             - GitHub GraphQL/REST calls, GitLab REST calls, and the
#                   worker's own MCP-over-HTTP listener (loopback, but still
#                   an outbound/listening socket from the worker's own code,
#                   not delegated to a spawned subprocess).
# runtime.worker  - required for any Tier 1 worker.
# browser_open    - required for the "open watched PR" command's
#                   open-ui-link action below. Client-executed (opens the
#                   row-badge's own href straight from the browser), no
#                   worker round-trip.
#
# No process.spawn declared: the worker shells to `aoe`/`gh`/`glab` as an
# ordinary child process (the NoSandbox worker model already permits this,
# same as the reference agent-of-empires.github plugin, which shells to
# `git`/`gh` under just the `net` capability). No session.read/session.write
# needed either: this plugin is never "attached" to a single session in the
# host's sense — it serves every session equally over its own MCP-over-HTTP
# listener, and resolves session identity from the caller's own
# $AOE_ARTIFACT_DIR, not via a host RPC.
capabilities = ["net", "runtime.worker", "browser_open"]

# Desktop-friendly alternative to the small row-badge chip: opens the
# active session's watched PR/MR straight from the command palette (or a
# keybind), reusing the row-badge entry's own hrefs — no worker round-trip.
# With more than one watched PR/MR for the session it shows a picker
# instead of guessing which one you meant.
[[commands]]
id = "open_pr"
title = "PR Watch: Open watched PR"
description = "Open the PR/MR this session is watching."

[commands.action]
kind = "open-ui-link"
slot = "row-badge"
id = "watched_badge"

[[keybinds]]
command = "open_pr"
key = "Ctrl+Shift+O"

# Host-wide dashboard panel listing every currently-watched PR/MR and its
# owning session, pushed via ui.state.set (requires api_version >= 13).
[[ui]]
slot = "home-pane"
id = "watched_prs"

# Per-session badge on the session row: one clickable chip per PR/MR that
# session is watching, tone-colored by CI state.
[[ui]]
slot = "row-badge"
id = "watched_badge"

# In-session tool-window pane (opened from that session's own dock, same
# pattern as the reference agent-of-empires.github plugin's pane): a plain
# list of links straight to whatever that session is watching, with no
# rigid-grid layout to fight and no nested-anchor click-target problem —
# the simple, reliable alternative to the small row-badge chip.
[[ui]]
slot = "pane"
id = "pr_pane"

# The worker has no way to know which of the daemon's possibly-several
# externally-reachable URLs (loopback, LAN, Tailscale, a reverse-proxied
# domain) you actually view the dashboard from, so the session link in the
# panel above needs this set explicitly — leave it empty to just show the
# session id as plain, unlinked text instead.
[[settings]]
key = "dashboard_base_url"
label = "Dashboard base URL"
description = "The URL you use to open the AoE dashboard (e.g. https://agent.example.com), used to build session links in the Watched PRs/MRs panel. Leave empty to show session ids without a link."
type = "string"
default = ""
advanced = true

[runtime]
kind = "command"
command = [".aoe-build/pr-watch-worker"]

[[runtime.build]]
command = ["go", "build", "-o", ".aoe-build/pr-watch-worker", "./cmd/pr-watch-worker"]
platforms = ["linux", "macos"]
