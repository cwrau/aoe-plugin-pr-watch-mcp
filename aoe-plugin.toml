# io.cwrau.pr-watch-mcp: persistent PR/MR watch service. See
# docs/superpowers/specs/2026-09-20-pr-watch-mcp-design.md for the design
# this manifest implements, and docs/superpowers/plans/2026-09-20-pr-watch-mcp.md
# for how the worker binary itself is built.

id = "io.cwrau.pr-watch-mcp"
name = "PR Watch"
version = "0.2.0"
api_version = 16
aoe_version = ">=1.20.0, <2.0.0"
description = "Persistent GitHub PR / GitLab MR watcher: register once, get woken on review/CI/merge activity, even across session restarts."

# net             - GitHub GraphQL/REST calls, GitLab REST calls, and the
#                   worker's own MCP-over-HTTP listener (loopback, but still
#                   an outbound/listening socket from the worker's own code,
#                   not delegated to a spawned subprocess).
# runtime.worker  - required for any Tier 1 worker.
# browser_open    - required for the "open watched PR" command's
#                   open-ui-link action below. Client-executed (opens the
#                   row-badge's own href straight from the browser), no
#                   worker round-trip.
# session.read    - lists sessions (`sessions.list`: lifecycle, titles and
#                   checkouts) and receives the host's
#                   `session.lifecycle.changed` (api_version >= 15) and
#                   `session.status.changed` (api_version >= 14)
#                   notifications. A session going Idle triggers one
#                   auto-discovery pass for just that session.
# session.message - delivers every PR/MR notification into the owning
#                   session via `sessions.message.send` (api_version >= 15),
#                   waking a stopped session and steering or queuing for a
#                   busy one. It reaches any session, which is why it is a
#                   capability of its own.
#
# The session pane renders each PR/MR description as a `markdown` block
# (api_version >= 15). A host without that block kind drops it silently, so
# the descriptions would disappear there.
#
# No process.spawn declared: the worker shells to `git`/`gh`/`glab` as an
# ordinary child process (the NoSandbox worker model already permits this,
# same as the reference agent-of-empires.github plugin, which shells to
# `git`/`gh` under just the `net` capability). It no longer runs the `aoe`
# CLI at all: sessions and messages go over the host RPC.
capabilities = ["net", "runtime.worker", "browser_open", "session.read", "session.message"]

# Desktop-friendly alternative to the small row-badge chip: opens the
# active session's watched PR/MR straight from the command palette (or a
# keybind), reusing the row-badge entry's own hrefs — no worker round-trip.
# With more than one watched PR/MR for the session it shows a picker
# instead of guessing which one you meant.
[[commands]]
id = "open_pr"
title = "PR Watch: Open watched PR"
description = "Open the PR/MR this session is watching."

[commands.action]
kind = "open-ui-link"
slot = "row-badge"
id = "watched_badge"

[[keybinds]]
command = "open_pr"
key = "Ctrl+Shift+O"

# A kanban-style dashboard page: every watched PR/MR as a card, in columns by
# state (needs attention, in review, ready, draft, done), plus the ones a
# notify-mode subscription announced that nobody watches yet. The worker pushes
# the cards with ui.state.set (slot "page", requires api_version >= 16); the
# page reads them through the host bridge. One self-contained file, since the
# host sandboxes it and blocks every other load.
[[ui]]
slot = "page"
id = "board"
title = "PR Board"
icon = "kanban"
entry = "pages/board.html"

# Per-session badge on the session row: one clickable chip per PR/MR that
# session is watching, tone-colored by CI state.
[[ui]]
slot = "row-badge"
id = "watched_badge"

# In-session tool-window pane (opened from that session's own dock, same
# pattern as the reference agent-of-empires.github plugin's pane): a plain
# list of links straight to whatever that session is watching, with no
# rigid-grid layout to fight and no nested-anchor click-target problem —
# the simple, reliable alternative to the small row-badge chip.
[[ui]]
slot = "pane"
id = "pr_pane"

# Facet values for the dashboard's session filters: an empty-text per-session
# cell whose filter_values (ci:failing, review:approved, pr:draft, ...) the
# global filter-facets below match on, so the sidebar and plugins such as the
# kanban board can filter sessions by one watch fact. The ids and values
# mirror the official GitHub plugin's, minus its platform prefix, since this
# plugin watches GitLab too.
[[ui]]
slot = "row-column"
id = "pr_status"

[[ui]]
slot = "filter-facet"
id = "ci"

[[ui]]
slot = "filter-facet"
id = "review"

[[ui]]
slot = "filter-facet"
id = "pr"

[[ui]]
slot = "filter-facet"
id = "comments"

[[ui]]
slot = "filter-facet"
id = "conflicts"

[[ui]]
slot = "filter-facet"
id = "queue"

[[ui]]
slot = "filter-facet"
id = "blocked"

[[ui]]
slot = "filter-facet"
id = "persona"

[[ui]]
slot = "filter-facet"
id = "my_review"

[[ui]]
slot = "filter-facet"
id = "snoozed"

[[ui]]
slot = "filter-facet"
id = "subscription"

[[ui]]
slot = "filter-facet"
id = "provider"

# Snooze rules: while a rule's gate command exits non-zero, registrations
# whose PR/MR URL matches one of its patterns (and none of its optional
# exclude patterns) are not polled at all, so
# nothing is notified. Everything that happened meanwhile is reported once
# the gate opens. Empty by default, i.e. nothing is ever snoozed.
[[settings]]
key = "snooze"
label = "Snooze rules"
description = "Mute watched PRs/MRs while a gate command reports closed (exits non-zero). Every rule that applies to a PR/MR (its persona is covered, a URL pattern matches and no exclude pattern does) counts, so it is only checked while all of its applying gates are open; PRs/MRs no rule applies to are never snoozed."
type = "object_list"
min_items = 0
max_items = 20

[[settings.fields]]
key = "match"
label = "URL patterns"
description = "Matched against the PR/MR URL without scheme, case-insensitively. * matches any characters including /, ? matches one. Example: gitlab.example.com/*"
type = "string_list"
required = true

[[settings.fields]]
key = "exclude"
label = "Exclude patterns"
description = "Optional. URLs matching any of these ignore this rule entirely (its gate is not run for them), even if a URL pattern matches. Same glob rules as the URL patterns. Example: github.com/my-org/*, so a catch-all rule leaves work PRs alone."
type = "string_list"

[[settings.fields]]
key = "persona"
label = "Applies to"
description = "Which watches this rule holds back: both (the default, and what rules saved before this setting did), author (PRs/MRs you wrote and watch) or reviewer (ones you review). Example: a usage-limit rule for reviewer only keeps your own PRs flowing."
type = "select"
options = ["both", "author", "reviewer"]
default = "both"

[[settings.fields]]
key = "gate"
label = "Gate command"
description = "Run with sh -c. Exit 0 = open (watch normally), non-zero = closed (snoozed). Example: systemctl --user is-active --quiet work.target"
type = "string"
required = true

# Comment filters: top-level PR/MR comments (the Conversation tab) matching
# a rule are left out of what's tracked, so they never ping. Evaluated
# against each comment's *current* body on every poll: a bot that edits a
# "review in progress" placeholder into the real review starts pinging the
# moment the edit stops matching. Empty by default, i.e. nothing is filtered.
[[settings]]
key = "comment_filters"
label = "Comment filters"
description = "Ignore matching top-level PR/MR comments (not reviews, not inline threads). A rule needs an author, at least one body text, or both; when both are set, the author must match and the body must contain any one of the texts."
type = "object_list"
min_items = 0
max_items = 20

[[settings.fields]]
key = "author"
label = "Author"
description = "Comment author's login/username, case-insensitive; a trailing [bot] is ignored. Example: coderabbitai"
type = "string"

[[settings.fields]]
key = "contains"
label = "Body contains"
description = "Case-insensitive texts; the comment body must contain at least one of them. Add several to cover more than one phrase for the same author. Example: review in progress"
type = "string_list"

[runtime]
kind = "command"
command = [".aoe-build/pr-watch-worker"]

[[runtime.build]]
command = ["go", "build", "-o", ".aoe-build/pr-watch-worker", "./cmd/pr-watch-worker"]
platforms = ["linux", "macos"]
